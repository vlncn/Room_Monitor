services:
  mosquitto:
    container_name: mosquitto
    image: eclipse-mosquitto:2
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
    restart: unless-stopped

  influxdb3-core:
    container_name: influxdb3-core
    image: influxdb:3-core
    ports:
      - 8181:8181
    command:
      - influxdb3
      - serve
      - --node-id=${INFLUXDB_NODE_ID}
      - --object-store=file
      - --data-dir=/var/lib/influxdb3
    volumes:
      - influxdb_data:/var/lib/influxdb3
    healthcheck:
      test: ["CMD-SHELL", "curl -f -H 'Authorization: Bearer ${INFLUXDB_TOKEN}' http://localhost:8181/health || exit 1"]
      interval: 1d
      timeout: 10s
      retries: 3
    restart: unless-stopped

  telegraf:
    container_name: telegraf
    image: telegraf
    depends_on: [influxdb3-core, mosquitto]
    environment:
      - INFLUXDB_HOST=${INFLUXDB_HOST}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG}  
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET}
      - TELEGRAF_COLLECTION_INTERVAL=${TELEGRAF_COLLECTION_INTERVAL}
      - HOSTNAME=telegraf
      - TELEGRAF_TOPIC_NOW=${TELEGRAF_TOPIC_NOW}
      - TELEGRAF_TOPIC_OLD_DATA=${TELEGRAF_TOPIC_OLD_DATA}
      - TELEGRAF_LONGITUDE=${TELEGRAF_LONGITUDE}
      - TELEGRAF_LATITUDE=${TELEGRAF_LATITUDE}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf
    restart: unless-stopped


  grafana:
    image: grafana/grafana
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    depends_on:
      - influxdb3-core
    # Or switch to influxdb3-enterprise as needed
    restart: unless-stopped

volumes:
  mosquitto_data:
  influxdb_data:
  grafana_data: