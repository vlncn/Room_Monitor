[agent]
  interval = "${TELEGRAF_COLLECTION_INTERVAL}"
  flush_interval = "${TELEGRAF_COLLECTION_INTERVAL}"
  hostname = "${HOSTNAME}"

[[inputs.http_response]] # Influxdb Health
  urls = ["http://${INFLUXDB_HOST}:8181/health"]
  token = "${INFLUXDB_TOKEN}"
  method = "GET"
  response_status_code = 200
  response_timeout = "5s"
  interval = "10s"
  name_override = "influxdb_health"

[[inputs.internal]]
  interval = "10s"
  collect_memstats = false

[[inputs.mqtt_consumer]] # Temperature and Humidity Data sent from esp32
  servers = ["tcp://mosquitto:1883"]
  topics = ["${TELEGRAF_TOPIC_NOW}", "${TELEGRAF_TOPIC_OLD_DATA}"]
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "Room 1 Temperature"
    timestamp_path = "measure_at"
    timestamp_format = "2006-01-02T15:04:05Z"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "message_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hum"
      type = "float"

[[inputs.http]] # Temperature and Humidity data from my City
  urls = ["https://api.open-meteo.com/v1/forecast?latitude=${TELEGRAF_LATITUDE}&longitude=${TELEGRAF_LONGITUDE}&current=temperature_2m,relative_humidity_2m"]
  interval = "15m"
  data_format = "json_v2"

  [inputs.http.tags]
    source = "open-meteo"

  [[inputs.http.json_v2]]
    measurement_name = "City Temperature"

    [[inputs.http.json_v2.field]]
      path = "current.temperature_2m"
      rename = "temp"

    [[inputs.http.json_v2.field]]
      path = "current.relative_humidity_2m"
      rename = "hum"

[[outputs.mqtt]]
  servers = ["tcp://mosquitto:1883"]
  topic = "infrastructure/health/timestamp"
  qos = 1
  retain = false
  keep_alive = 30
  client_id = "TelegrafInfluxHealth"
  layout = "batch"
  data_format = "json"
  json_timestamp_units = "1ms"
  namepass = ["influxdb_health", "internal_agent"]
  json_transformation = '''
  {
    "influxdb_timestamp": $fromMillis(metrics[name = "influxdb_health"].timestamp[0]),
    "telegraf_timestamp": $fromMillis(metrics[name = "internal_agent"].timestamp[0])
  }
  '''

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8181"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

