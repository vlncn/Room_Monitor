[agent]
  interval = "${TELEGRAF_COLLECTION_INTERVAL}"
  flush_interval = "${TELEGRAF_COLLECTION_INTERVAL}"
  hostname = "${HOSTNAME}"

[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["${TELEGRAF_TOPIC_NOW}", "${TELEGRAF_TOPIC_OLD_DATA}"]
  data_format = "json_v2"

  [[inputs.mqtt_consumer.json_v2]]
    measurement_name = "Room 1 Temperature"
    timestamp_path = "measure_at"
    timestamp_format = "2006-01-02T15:04:05Z"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "message_id"

    [[inputs.mqtt_consumer.json_v2.tag]]
      path = "device_id"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "temp"
      type = "float"

    [[inputs.mqtt_consumer.json_v2.field]]
      path = "hum"
      type = "float"

[[inputs.http]]
  urls = ["https://api.open-meteo.com/v1/forecast?latitude=${TELEGRAF_LATITUDE}&longitude=${TELEGRAF_LONGITUDE}&current=temperature_2m,relative_humidity_2m"]
  interval = "1m"
  data_format = "json_v2"

  [inputs.http.tags]
    source = "open-meteo"

  [[inputs.http.json_v2]]
    measurement_name = "City Temperature"

    [[inputs.http.json_v2.field]]
      path = "current.temperature_2m"
      rename = "temp"

    [[inputs.http.json_v2.field]]
      path = "current.relative_humidity_2m"
      rename = "hum"

[[outputs.influxdb_v2]]
  urls = ["http://${INFLUXDB_HOST}:8181"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"

